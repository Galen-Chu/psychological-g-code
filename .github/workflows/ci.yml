name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install   # 本 repo 不提交 package-lock.json，npm ci 不可用

    - name: Validate data against schema
      run: npm run validate

    - name: Syntax-check JS sources
      run: |
        node --check src/assessment-engine.js
        node --check scripts/validate-data.js

    - name: Run engine tests
      run: npm test
